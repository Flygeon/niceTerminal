# niceTerminal — Windows build & release pipeline
#
# Local Windows dev machines without a full Tauri toolchain build here instead:
#   * every push / PR: frontend typecheck + Windows installer (NSIS) artifact
#   * every v* tag:     signed-unsigned release via tauri-action (GitHub Release)
#
# Signing: no code-signing cert is configured yet, so installed apps will show
# a SmartScreen warning. See README "Releases & signing" to add one later.

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # --- 1. Frontend: typecheck + production bundle ----------------------------
  frontend:
    name: Frontend check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + build (tsc && vite)
        run: npm run build

  # --- 2. Tauri: compile Rust, run unit tests, bundle NSIS installer ---------
  tauri:
    name: Tauri build (Windows)
    runs-on: windows-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build & bundle (NSIS)
        run: npm run tauri build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: niceTerminal-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # --- 3. Release: publish GitHub Release on version tags --------------------
  release:
    name: Publish GitHub Release
    runs-on: windows-latest
    needs: tauri
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "niceTerminal v__VERSION__"
          releaseBody: "Install from the assets below. Unsigned build — SmartScreen will warn."
          releaseDraft: true
          prerelease: false
